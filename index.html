<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Thumbnail Company Changer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{--bg:#E8EBF0;--sf:#fff;--ink:#101828;--mu:#5B6577;--ln:#CBD2DC;--ac:#FFC800;--ok:#0F7B4B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1117;--sf:#171B24;--ink:#EEF1F6;--mu:#98A2B3;--ln:#2C3340;--ok:#5FD39B}}
:root[data-theme="dark"]{--bg:#0E1117;--sf:#171B24;--ink:#EEF1F6;--mu:#98A2B3;--ln:#2C3340;--ok:#5FD39B}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
header,main{max-width:1200px;margin:auto;padding-left:20px;padding-right:20px}
header{padding-top:28px}
h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mu);margin:6px 0 0}
main{display:grid;gap:16px;padding-top:16px;padding-bottom:40px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px}
h2{font-size:19px;margin-bottom:10px}
h3{font-size:17px;margin-bottom:8px}
.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:900px){.panels{grid-template-columns:1fr}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 3px}
label small{font-weight:400;color:var(--mu)}
input[type=text],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--ln);border-radius:8px;padding:8px 10px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
.pnl{border-top:5px solid var(--ac)}
.pnl:nth-child(2){border-top-color:#5B8DEF}
.pnl:nth-child(3){border-top-color:#B04BE0}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:8px;border:1.5px solid var(--ink);background:var(--sf);color:var(--ink);padding:9px 16px}
button.pri{background:var(--ac);color:#101828;border-color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#out{width:100%;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);border:1.5px solid var(--ln);border-radius:8px;padding:10px;resize:vertical}
.mu{color:var(--mu);font-size:14px}
</style>
</head>
<body>
<header>
<h1>Thumbnail Company Changer</h1>
<p class="sub">Neeche teen companies ke naam daalo. Naya JSON apne aap ban jayega, use ChatGPT par paste karo.</p>
</header>
<main>
<section class="card">
<h2>Video ka text</h2>
<div class="g2">
<div><label for="headline">Bada headline</label><input type="text" id="headline" value="3 TECH STOCKS"></div>
<div><label for="subhead">Hindi line (neeche wali)</label><input type="text" id="subhead" value="कहां है बड़ा मौका ?"></div>
<div><label for="badgeTop">Badge ka bada text</label><input type="text" id="badgeTop" value="Q2"></div>
<div><label for="badgeBottom">Laal ribbon ka text</label><input type="text" id="badgeBottom" value="RESULTS"></div>
</div>
</section>
<div class="panels" id="panels"></div>
<section class="card">
<h2>Naya JSON</h2>
<textarea id="out" rows="18" readonly></textarea>
<div class="row">
<button class="pri" id="copyPrompt" type="button">ChatGPT ke liye copy karo</button>
<button id="copy" type="button">Sirf JSON copy karo</button>
<button id="dl" type="button">JSON file download karo</button>
</div>
<p class="mu">“ChatGPT ke liye copy karo” JSON ke saath “is JSON ke hisaab se thumbnail banao” bhi jod deta hai.</p>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
const SECT={
 semiconductor:{l:'Semiconductor / Chip',scene:'purple and magenta glowing circuit board with tiny electronic components and neon traces, a large black semiconductor chip in the middle with the company name printed on it in white, a bright green upward arrow at the bottom right',hero:'large black semiconductor chip on a purple circuit board',chip:'name',theme:'deep purple, magenta and neon pink with a green arrow accent'},
 ai:{l:'AI / Data center / IT',scene:'rows of glowing blue server racks in a dark data center, a bright glowing blue AI processor chip with the letters AI in front, faint cyan rising candlestick chart lines in the upper right',hero:'glowing blue AI chip with neon circuit edges',chip:'AI',theme:'deep navy blue and electric cyan'},
 defence:{l:'Defence',scene:'fighter jets, a drone, radar dishes and a missile launcher on a dark battlefield horizon, cloudy grey-blue sky, green and red candlestick chart lines in the background',hero:'fighter jet with defence systems',chip:'',theme:'steel grey, olive green and cool blue with orange highlights'},
 aerospace:{l:'Aerospace / Electronics manufacturing',scene:'a white passenger airliner on the left, a fighter jet and drone flying on the right, heavy metallic aerospace and electronics machinery in the foreground, cloudy grey-blue sky, green and red candlestick chart lines in the background',hero:'aerospace and defence machinery with aircraft',chip:'',theme:'steel grey, silver and cool blue'},
 ship:{l:'Shipbuilding / Naval',scene:'a large grey naval warship at a dockyard with tall cranes, ocean at sunset with blue and orange sky, glowing candlestick chart lines rising in the background',hero:'large naval warship at a dockyard',chip:'',theme:'navy blue, steel grey and sunset orange'},
 auto:{l:'Auto / EV',scene:'a sleek electric car with glowing headlights on a futuristic road, charging station with neon light, green candlestick chart lines rising in the background',hero:'sleek electric car',chip:'',theme:'dark teal, electric green and silver'},
 pharma:{l:'Pharma / Healthcare',scene:'a modern laboratory with glowing glass flasks, floating capsules and a DNA helix, clean blue and white light, green candlestick chart lines in the background',hero:'glowing DNA helix with capsules',chip:'',theme:'clean blue, white and mint green'},
 bank:{l:'Bank / Finance',scene:'tall glass bank skyscrapers, golden coins and rupee symbols floating, a rising green candlestick chart in the background',hero:'golden coins with rupee symbol in front of skyscrapers',chip:'',theme:'deep blue and gold'},
 energy:{l:'Energy / Solar / Power',scene:'solar panel fields and wind turbines at golden hour, glowing power lines, green candlestick chart lines rising in the background',hero:'wind turbines and solar panels',chip:'',theme:'bright yellow, sky blue and green'},
 rail:{l:'Railway / Infra',scene:'a modern bullet train speeding on an elevated track at dusk with glowing lights, steel bridge and city skyline, rising candlestick chart lines in the background',hero:'modern bullet train on elevated track',chip:'',theme:'cool blue, white and orange'},
 custom:{l:'Apna scene khud likhunga',scene:'',hero:'',chip:'',theme:'bright saturated colors matching the company'}
};
const POS=['left panel','center panel','right panel'];
const LOGO=[
 'company name in huge bold white italic sans-serif with soft drop shadow, subtext (if any) in small widely spaced white capitals directly below',
 'company name in dark navy wide bold capitals, if subtext exists a thin vertical divider line then the subtext in bright blue bold capitals; light white-grey fade behind the logo so it stays readable',
 'company name in huge chunky rounded white capitals with soft shadow, top right'
];
const DEF=[{n:'Netweb',s:'TECHNOLOGIES',k:'ai'},{n:'CYIENT',s:'DLM',k:'aerospace'},{n:'MOSCHIP',s:'',k:'semiconductor'}];
const P=[];
const box=$('#panels');
DEF.forEach((d,i)=>{
 const c=document.createElement('section');c.className='card pnl';
 c.innerHTML='<h3>'+['Left','Beech wala','Right'][i]+' panel</h3>'+
 '<label>Company ka naam</label><input type="text" class="n">'+
 '<label>Chhota text neeche <small>(optional, jaise TECHNOLOGIES)</small></label><input type="text" class="s">'+
 '<label>Company ka kaam</label><select class="k">'+Object.keys(SECT).map(k=>'<option value="'+k+'">'+SECT[k].l+'</option>').join('')+'</select>'+
 '<label>Background scene <small>(badal sakte ho)</small></label><textarea class="sc" rows="5"></textarea>'+
 '<label>Chip par likha text <small>(khali = apne aap)</small></label><input type="text" class="ch">';
 box.append(c);
 const p={n:c.querySelector('.n'),s:c.querySelector('.s'),k:c.querySelector('.k'),sc:c.querySelector('.sc'),ch:c.querySelector('.ch')};
 p.n.value=d.n;p.s.value=d.s;p.k.value=d.k;p.sc.value=SECT[d.k].scene;
 p.k.onchange=()=>{p.sc.value=SECT[p.k.value].scene;render();};
 [p.n,p.s,p.sc,p.ch].forEach(e=>e.oninput=render);
 P.push(p);
});
['headline','subhead','badgeTop','badgeBottom'].forEach(id=>$('#'+id).oninput=render);
function obj(){
 const cos=P.map((p,i)=>{
  const S=SECT[p.k.value],name=p.n.value.trim()||'COMPANY',scene=p.sc.value.trim()||S.scene;
  const chip=p.ch.value.trim()||(S.chip==='name'?name.toUpperCase():S.chip);
  return {position:POS[i],company_name:name,company_subtext:p.s.value.trim(),logo_style:LOGO[i],background_scene:scene,
   hero_object:{description:p.k.value==='custom'?scene:S.hero,chip_label:chip},
   color_theme:S.theme+(i===1?', brighter at the top':'')};
 });
 return {
  task:'Create a high-CTR YouTube thumbnail for an Indian stock market video, exactly in the layout and style described below. Only the items marked as changeable should differ from this description.',
  canvas:{aspect_ratio:'16:9',size:'1672x941',quality:'ultra sharp, high contrast, saturated colors, professional finance news thumbnail'},
  companies:cos,
  panel_layout:{structure:'three vertical panels side by side in the top 60 percent of the image, separated by thin slanted white edges so the center panel looks like a trapezoid, the center panel is a little brighter and on top',
   company_swap_rule:'Each panel must clearly show its own company logo text, subtext, background scene, hero object and chip label. Keep the layout, fonts, positions, text colors and effects unchanged.'},
  center_badge:{top_text:$('#badgeTop').value.trim(),bottom_text:$('#badgeBottom').value.trim(),
   style:'black rounded rectangle with thin white border at the center top of the center panel, containing very large glossy yellow-orange gradient top text with thick black outline; below it a glowing red ribbon banner with white bold bottom text with black outline'},
  headline:{text_main:$('#headline').value.trim(),
   style:'extra large ultra bold italic capitals across the full width near the bottom third, the first number in glossy yellow-orange gradient and much larger, the middle word in white, the last word in glossy yellow, every letter with thick black outline, strong drop shadow and slight 3D look',
   behind_text:'a thick red torn brush-stroke banner with rough edges and a red glow behind the whole headline'},
  subheadline:{text:$('#subhead').value.trim(),language:'Hindi (Devanagari)',
   style:'large bold Hindi text inside a dark black-green rectangular bar with a thin glowing neon green border, below the headline, first words in white and last words in bright yellow, thick black outline'},
  bottom_background:{description:'dark navy to black base with glowing green candlestick chart rising at the bottom left and bottom right corners, subtle glow'},
  color_palette:{headline_yellow:'#FFD400',headline_white:'#FFFFFF',banner_red:'#D91E18',neon_green:'#22E65A',panel_blue:'#0A3FA8',panel_purple:'#8A2BE2',dark_base:'#050B1A'},
  rules:['Write all text exactly as given, with correct spelling','Hindi text must be in clean Devanagari, no broken or garbled letters','Do not add any extra text, watermark or people','Keep every text very large and readable even at small mobile size','Keep the same layout, fonts, effects and positions every time']
 };
}
function render(){
 $('#out').value=JSON.stringify(obj(),null,2);
 try{localStorage.setItem('thumbChanger',JSON.stringify({h:['headline','subhead','badgeTop','badgeBottom'].map(i=>$('#'+i).value),p:P.map(p=>[p.n.value,p.s.value,p.k.value,p.sc.value,p.ch.value])}));}catch(e){}
}
function restore(){
 try{
  const d=JSON.parse(localStorage.getItem('thumbChanger')||'null');if(!d)return;
  ['headline','subhead','badgeTop','badgeBottom'].forEach((id,i)=>{if(d.h[i]!==undefined)$('#'+id).value=d.h[i];});
  d.p.forEach((v,i)=>{const p=P[i];if(!p)return;p.n.value=v[0];p.s.value=v[1];p.k.value=v[2];p.sc.value=v[3];p.ch.value=v[4];});
 }catch(e){}
}
async function copyText(t,btn,label){
 try{await navigator.clipboard.writeText(t);}catch(e){const o=$('#out');o.removeAttribute('readonly');o.select();document.execCommand('copy');o.setAttribute('readonly','');}
 btn.textContent='Copy ho gaya';setTimeout(()=>btn.textContent=label,1500);
}
$('#copy').onclick=e=>copyText($('#out').value,e.target,'Sirf JSON copy karo');
$('#copyPrompt').onclick=e=>copyText('Is JSON ke hisaab se thumbnail banao:\n\n'+$('#out').value,e.target,'ChatGPT ke liye copy karo');
$('#dl').onclick=()=>{
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([$('#out').value],{type:'application/json'}));
 a.download='thumbnail-'+(P.map(p=>p.n.value.trim().toLowerCase().replace(/[^a-z0-9]+/g,'')).filter(Boolean).join('-')||'style')+'.json';
 document.body.append(a);a.click();a.remove();
};
restore();render();
</script>
</body>
</html>
