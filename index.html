<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Diary</title>
<style>
  :root{
    --paper:#fbfaf6; --line:#cfe0ee; --ink:#3a2fa6; --ink-soft:#6b62c9; --margin:#e2a0a0;
    --bg:#2b2a33; --ok:#1f7a4d; --warn:#b3261e;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",Roboto,"Noto Sans Devanagari","Nirmala UI",Arial,sans-serif; font-size:17px; line-height:1.5;
    padding:14px;
  }
  .notebook{
    max-width:980px; margin:0 auto; background:var(--paper); border-radius:6px;
    padding:20px 22px 160px 46px; position:relative; min-height:170vh;
    background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--line) 31px,var(--line) 32px);
    box-shadow:0 6px 24px rgba(0,0,0,.4);
  }
  .notebook::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:2px;background:var(--margin)}
  .holes{position:absolute;left:8px;top:0;bottom:0;width:14px;
    background:radial-gradient(circle 6px at 7px 18px,#2b2a33 98%,transparent) 0 0/14px 64px repeat-y}

  /* hand-drawn box */
  .box{border:2px solid var(--ink);border-radius:255px 12px 225px 12px/12px 225px 12px 255px;background:var(--paper)}
  button{font:inherit;color:var(--ink);cursor:pointer}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f0a500;outline-offset:2px}

  /* top row, as in the notebook */
  .top{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;margin-bottom:16px}
  .tbtn{padding:4px 16px;font-weight:700;font-size:19px;background:var(--paper)}
  .tbtn:hover{background:#ece9ff}
  .tbtn small{display:block;font-weight:400;font-size:12px;color:var(--ink-soft)}
  .center{text-align:center}
  .datebar{display:flex;align-items:center;justify-content:center;gap:8px}
  .datebar button.nav{border:0;background:none;font-size:26px;padding:0 6px}
  #dateShow{font-size:26px;font-weight:700;cursor:pointer;position:relative}
  #datePick{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
  .mini{padding:1px 10px;font-weight:700;font-size:14px;background:var(--paper)}
  .mini:hover{background:#ece9ff}
  .btnrow{align-items:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px}
  .row.line{grid-template-columns:1fr 34px;align-items:center;border-top:0;padding:10px 0}
  .row.line+.row{border-top:0}
  .sep{border-top:4px solid #ff3b1f;border-radius:4px}
  .goal{padding:6px 12px 8px;min-width:210px;max-width:260px}
  .goal h3{margin:0 0 2px;font-size:19px}
  .goal ul{list-style:none;margin:0;padding:0}
  .goal li{display:flex;gap:6px;align-items:center;font-size:16px}
  .goal li.done span{text-decoration:line-through;opacity:.55}
  .goal li button{border:0;background:none;font-size:14px;opacity:.5;padding:0 2px}
  .goal input[type=text]{width:100%;border:0;border-bottom:1.5px dashed var(--ink-soft);background:transparent;font:inherit;font-size:15px;color:var(--ink);margin-top:4px}

  /* day meta */
  .meta{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:6px 0 14px}
  .meta label{display:flex;gap:6px;align-items:center}
  .meta input{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--ink);padding:0 4px}
  #title{flex:1;min-width:200px}
  #views{width:110px}

  .target{padding:3px 10px 5px;max-width:340px;font-size:15px;line-height:1.35}
  .target h3{margin:0 0 1px;font-size:16px}
  .target ul{list-style:none;margin:0;padding:0}
  .target li{display:flex;gap:6px;align-items:center}
  .target li.done span{text-decoration:line-through;opacity:.55}
  .target li span{flex:1}
  .target li button{border:0;background:none;font-size:16px;opacity:.55;padding:0 4px}
  .target input[type=text]{width:100%;border:0;border-bottom:1.5px dashed var(--ink-soft);background:transparent;font:inherit;font-size:14px;color:var(--ink);margin-top:2px}
  .target input[type=checkbox]{width:15px;height:15px}

  /* entries */
  .entries{padding:10px 12px;min-height:65vh}
  .row{display:grid;grid-template-columns:150px 1fr 34px;gap:12px;padding:6px 0;align-items:start}
  .row+.row{border-top:1.5px dashed var(--line)}
  .tag{padding:2px 8px;text-align:center;font-weight:700;background:var(--paper)}
  .tag input{font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:transparent;border:0;width:100%;text-align:center}
  .row textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;resize:none;overflow:hidden;min-height:34px;line-height:1.55}
  .row textarea::placeholder{color:#9a94d6}
  .tinyth{font-size:11px;line-height:1.4;padding:0 6px;border:1px solid var(--ink-soft);border-radius:4px;background:var(--paper);color:var(--ink-soft);cursor:pointer}
  .tinyth:hover{background:#ece9ff;color:var(--ink)}
  .vw input::placeholder{color:#777}
  .vrow{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:2px}
  .vw{font-size:15px;display:flex;gap:6px;align-items:center;color:var(--ink-soft);margin-top:2px}
  .vw input{font:inherit;color:#000;background:transparent;border:0;border-bottom:1.5px solid #000;width:min(320px,60vw)}
  .del{border:2px solid var(--warn);background:#fff;color:var(--warn);font-size:18px;font-weight:700;line-height:1;width:30px;height:30px;border-radius:50%;padding:0;cursor:pointer}
  .del:hover{background:var(--warn);color:#fff}
  /* side buttons (delete + views/thumbnail toggle) */
  .side{display:flex;flex-direction:column;gap:6px;align-items:center}
  .tog{border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:15px;font-weight:700;line-height:1;width:30px;height:30px;border-radius:50%;padding:0;cursor:pointer}
  .tog:hover,.tog.on{background:var(--ink);color:#fff}
  .fbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;padding:5px 8px;z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .fbar button{border:1.5px solid var(--ink);border-radius:6px;background:var(--paper);padding:3px 12px;font-weight:700;font-size:16px;white-space:nowrap}
  .fbar button:hover{background:#ece9ff}
  #toast{position:fixed;left:50%;bottom:68px;transform:translateX(-50%);background:#2b2a33;color:#fff;padding:10px 16px;border-radius:8px;display:none;gap:14px;align-items:center;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.4)}
  #toast.show{display:flex}
  #toast button{background:none;border:0;color:#ffd166;font-weight:700;font-size:17px;cursor:pointer}
  .thumbcol{display:flex;flex-direction:column;gap:6px}
  .thumbimg{max-width:300px;width:100%;border:2px solid var(--ink);border-radius:6px;display:block}
  .pick{display:inline-block;border:1.5px dashed var(--ink-soft);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:15px;width:fit-content}
  .pick input{display:none}
  .empty{padding:26px 8px;color:var(--ink-soft);text-align:center}

  /* all videos */
  .tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .tools button{padding:3px 14px;background:var(--paper)}
  .tools button:hover{background:#ece9ff}
  #all{margin-top:14px;padding:10px 14px;display:none}
  #all.open{display:block}
  .vid{display:grid;grid-template-columns:130px 1fr;gap:2px 10px;padding:6px 0;cursor:pointer;align-items:center}
  .vid+.vid{border-top:1.5px dashed var(--line)}
  .vid:hover{background:#f1efff}
  .vid .v{text-align:right;font-weight:700}
  .vid .sub{font-size:15px;color:var(--ink-soft);grid-column:1/3}
  .best{color:var(--ok);font-size:14px}

  @media (max-width:720px){
    body{padding:6px;font-size:17px}
    .notebook{padding:14px 12px 140px 34px}
    .notebook::before{left:26px}
    .top{grid-template-columns:1fr 1fr}
    .center{grid-column:1/3;grid-row:1}
    .goal{grid-column:1/3;max-width:none}
    .target{grid-column:1/3;max-width:none}
    .row{grid-template-columns:128px 1fr 34px;gap:8px}
    .row.line{grid-template-columns:1fr 34px}
    .vid{grid-template-columns:100px 1fr}
  }
  @media (prefers-reduced-motion:no-preference){ .row{animation:in .2s ease-out} @keyframes in{from{opacity:0;transform:translateY(-4px)}} }
</style>
</head>
<body>
<div class="notebook">
  <div class="holes" aria-hidden="true"></div>

  <div class="top">
  <div class="target box">
    <h3>Today's Target (आज का टारगेट)</h3>
    <ul id="targetList"></ul>
    <input type="text" id="targetNew" placeholder="+ टारगेट लिखो, Enter दबाओ">
  </div>

    <div class="center">
      <div class="datebar">
        <button class="nav" id="prev" aria-label="पिछला दिन">‹</button>
        <div id="dateShow"><span id="dateText"></span><input type="date" id="datePick" aria-label="तारीख चुनो"></div>
        <button class="nav" id="next" aria-label="अगला दिन">›</button>
      </div>
    </div>

    <div class="goal box">
      <h3 id="goalTitle">Goal</h3>
      <ul id="goalList"></ul>
      <input type="text" id="goalNew" placeholder="+ नया लक्ष्य लिखो, फिर Enter दबाओ">
    </div>
  </div>

  <div class="entries box" id="entries"></div>

  <div class="tools">
    <button class="box" id="toggleAll">सारे वीडियो और व्यूज़</button>
    <button class="box" id="export">बैकअप डाउनलोड करो</button>
    <button class="box" id="importBtn">बैकअप वापस लाओ</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
  <div class="box" id="all"></div>
</div>

<div class="fbar box" id="fbar">
  <button type="button" id="fTime">Time <span id="fClock"></span></button>
  <button type="button" id="fThumb">Thumbnail (थंबनेल)</button>
  <button type="button" id="fLine">Line (लाइन)</button>
</div>
<div id="toast" role="status"></div>
<script>
(function(){
  const KEY='videoDiaryV1';
  let db={days:{},goals:{}};
  try{ const s=localStorage.getItem(KEY); if(s) db=JSON.parse(s); }catch(e){}
  db.days=db.days||{}; db.goals=db.goals||{};

  const $=id=>document.getElementById(id);
  const pad=n=>String(n).padStart(2,'0');
  const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const HMON=['जनवरी','फ़रवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];
  const MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
  const pretty=k=>{const d=parse(k);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
  const nowHHMM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
  const fmt12=t=>{if(!t)return'';const [h,m]=t.split(':').map(Number);return (h%12||12)+':'+pad(m)+' '+(h<12?'AM':'PM')};

  let cur=ymd(new Date());

  function save(){
    try{ localStorage.setItem(KEY,JSON.stringify(db)); }
    catch(e){ alert('सेव नहीं हुआ: जगह भर गई है। "बैकअप डाउनलोड करो" करके पुरानी फोटो हटा दो।'); }
  }
  function day(k=cur){ return db.days[k]||(db.days[k]={title:'',views:'',result:'',entries:[]}); }
  function grow(t){ t.style.height='auto'; t.style.height=t.scrollHeight+'px'; }

  /* Views/थंबनेल वाला हिस्सा तभी दिखे जब बटन दबाया हो (या views पहले से लिखे हों) */
  function isOpen(en){ return en.open===true || (en.open===undefined && !!en.views); }

  /* ---------- header ---------- */
  function renderHead(){
    $('dateText').textContent=pretty(cur);
    $('datePick').value=cur;
    const d=parse(cur);
    $('goalTitle').textContent=MON[d.getMonth()]+' Goal ('+HMON[d.getMonth()]+' का लक्ष्य)';
  }
  function tickClock(){ $('fClock').textContent=fmt12(nowHHMM()); }
  setInterval(tickClock,15000); tickClock();

  /* ---------- goals (month wise) ---------- */
  function renderGoals(){
    const mk=cur.slice(0,7), list=db.goals[mk]||[];
    $('goalList').innerHTML=list.map((g,i)=>
      `<li class="${g.done?'done':''}"><input type="checkbox" data-g="${i}" ${g.done?'checked':''} aria-label="पूरा हुआ"><span>${esc(g.t)}</span><button data-gd="${i}" aria-label="लक्ष्य हटाओ">×</button></li>`
    ).join('');
  }
  $('goalList').addEventListener('change',e=>{
    const i=e.target.dataset.g; if(i==null)return;
    const mk=cur.slice(0,7); db.goals[mk][i].done=e.target.checked; save(); renderGoals();
  });
  $('goalList').addEventListener('click',e=>{
    const i=e.target.dataset.gd; if(i==null)return;
    db.goals[cur.slice(0,7)].splice(i,1); save(); renderGoals();
  });
  $('goalNew').addEventListener('keydown',e=>{
    if(e.key!=='Enter')return; const v=e.target.value.trim(); if(!v)return;
    const mk=cur.slice(0,7); (db.goals[mk]=db.goals[mk]||[]).push({t:v,done:false});
    e.target.value=''; save(); renderGoals();
  });

  /* ---------- today's target (day wise) ---------- */
  function renderTargets(){
    const list=day().targets||[];
    $('targetList').innerHTML=list.map((g,i)=>
      `<li class="${g.done?'done':''}"><input type="checkbox" data-t="${i}" ${g.done?'checked':''} aria-label="पूरा हुआ"><span>${esc(g.t)}</span><button data-td="${i}" aria-label="टारगेट हटाओ">×</button></li>`
    ).join('');
  }
  $('targetList').addEventListener('change',e=>{
    const i=e.target.dataset.t; if(i==null)return;
    day().targets[i].done=e.target.checked; save(); renderTargets();
  });
  $('targetList').addEventListener('click',e=>{
    const i=e.target.dataset.td; if(i==null)return;
    day().targets.splice(i,1); save(); renderTargets();
  });
  $('targetNew').addEventListener('keydown',e=>{
    if(e.key!=='Enter')return; const v=e.target.value.trim(); if(!v)return;
    const x=day(); (x.targets=x.targets||[]).push({t:v,done:false});
    e.target.value=''; save(); renderTargets();
  });

  /* ---------- entries ---------- */
  function renderEntries(){
    const list=day().entries;
    if(!list.length){
      $('entries').innerHTML='<div class="empty">अभी कुछ नहीं लिखा है। ऊपर <b>Time</b> दबाओ और लिखो अभी क्या कर रहे हो और ये वीडियो क्यों बना रहे हो। फिर <b>Thumbnail</b> दबाओ और लिखो कि थंबनेल ऐसा क्यों बनाया।</div>';
      return;
    }
    $('entries').innerHTML=list.map(en=>{
      if(en.type==='line'){
        return `<div class="row line" data-id="${en.id}"><div class="sep"></div><button class="del" data-del aria-label="लाइन हटाओ">×</button></div>`;
      }
      if(en.type==='time'){
        const open=isOpen(en);
        return `<div class="row" data-id="${en.id}">
          <div class="tag box"><input type="time" data-f="time" value="${esc(en.time)}" aria-label="Time"></div>
          <div><textarea data-f="text" rows="1" placeholder="अभी क्या कर रहा हूँ? ये वीडियो क्यों बना रहा हूँ? स्क्रिप्ट ऐसी क्यों लिखी?">${esc(en.text)}</textarea>
            ${open?`<div class="vrow"><label class="vw">Views (व्यूज़):<input type="text" data-f="views" value="${esc(en.views)}" placeholder="व्यूज़ या कुछ भी लिखो"></label><button type="button" class="tinyth" data-addthumb title="इस वीडियो के नीचे थंबनेल जोड़ो">+ थंबनेल</button></div>`:''}</div>
          <div class="side">
            <button class="del" data-del aria-label="हटाओ">×</button>
            <button type="button" class="tog ${open?'on':''}" data-tog aria-expanded="${open}" aria-label="${open?'Views और थंबनेल छुपाओ':'Views और थंबनेल दिखाओ'}" title="${open?'Views / थंबनेल छुपाओ':'Views / थंबनेल दिखाओ'}">${open?'▴':'▾'}</button>
          </div></div>`;
      }
      return `<div class="row" data-id="${en.id}">
        <div class="tag box">Thumbnail</div>
        <div class="thumbcol">
          ${en.img?`<img class="thumbimg" src="${en.img}" alt="थंबनेल">`:''}
          <label class="pick"><input type="file" accept="image/*" data-img>${en.img?'फोटो बदलो':'+ थंबनेल की फोटो लगाओ'}</label>
          <textarea data-f="text" rows="1" placeholder="इस वीडियो का थंबनेल ऐसा क्यों बनाया? क्या सोचकर बनाया? (टेक्स्ट, रंग, चेहरा, और क्यों)">${esc(en.text)}</textarea>
        </div>
        <button class="del" data-del aria-label="हटाओ">×</button></div>`;
    }).join('');
    $('entries').querySelectorAll('textarea').forEach(grow);
  }
  $('entries').addEventListener('input',e=>{
    const row=e.target.closest('.row'); if(!row)return;
    const en=day().entries.find(x=>x.id===row.dataset.id); if(!en)return;
    const f=e.target.dataset.f; if(!f)return;
    en[f]=e.target.value; if(e.target.tagName==='TEXTAREA')grow(e.target); save();
  });
  $('entries').addEventListener('click',e=>{
    const tog=e.target.closest('[data-tog]');
    if(tog){
      const row=tog.closest('.row');
      const en=day().entries.find(x=>x.id===row.dataset.id); if(!en)return;
      en.open=!isOpen(en); save(); renderEntries();
      if(en.open){
        const r=$('entries').querySelector('.row[data-id="'+en.id+'"]');
        const inp=r&&r.querySelector('input[data-f="views"]'); if(inp)inp.focus();
      }
      return;
    }
    if(e.target.hasAttribute('data-addthumb')){ addThumbAfter(e.target.closest('.row').dataset.id); return; }
    if(!e.target.hasAttribute('data-del'))return;
    const row=e.target.closest('.row');
    const x=day(); const idx=x.entries.findIndex(i=>i.id===row.dataset.id); if(idx<0)return;
    const removed=x.entries.splice(idx,1)[0]; const k=cur; save(); renderEntries();
    showToast('एंट्री हट गई',()=>{ day(k).entries.splice(idx,0,removed); save(); renderEntries(); });
  });
  $('entries').addEventListener('change',e=>{
    if(!e.target.hasAttribute('data-img'))return;
    const file=e.target.files[0]; if(!file)return;
    const id=e.target.closest('.row').dataset.id;
    shrink(file,720,.75).then(url=>{
      const en=day().entries.find(x=>x.id===id); en.img=url; save(); renderEntries();
    });
  });
  function shrink(file,max,q){
    return new Promise(res=>{
      const r=new FileReader();
      r.onload=()=>{ const im=new Image(); im.onload=()=>{
        const s=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas'); c.width=im.width*s; c.height=im.height*s;
        c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q));
      }; im.src=r.result; };
      r.readAsDataURL(file);
    });
  }

  function addThumbAfter(id){
    const x=day(); let i=id?x.entries.findIndex(e=>e.id===id):-1;
    if(i<0){ for(let k=x.entries.length-1;k>=0;k--){ if(x.entries[k].type==='time'){i=k;break;} } }
    const en={id:uid(),type:'thumb',img:'',text:''};
    if(i<0){ x.entries.push(en); }
    else { let j=i+1; while(j<x.entries.length&&x.entries[j].type==='thumb')j++; x.entries.splice(j,0,en); }
    save(); renderEntries();
    const row=$('entries').querySelector('.row[data-id="'+en.id+'"]');
    if(row){ const ta=row.querySelector('textarea'); if(ta)ta.focus(); row.scrollIntoView({block:'center',behavior:'smooth'}); }
  }
  let toastT;
  function showToast(msg,undo){
    const t=$('toast'); t.innerHTML='<span>'+msg+'</span><button type="button">वापस लाओ</button>';
    t.classList.add('show'); clearTimeout(toastT);
    t.querySelector('button').onclick=()=>{undo();t.classList.remove('show')};
    toastT=setTimeout(()=>t.classList.remove('show'),6000);
  }
  function add(type){
    const x=day();
    x.entries.push(type==='time'?{id:uid(),type:'time',time:nowHHMM(),text:'',views:''}:type==='line'?{id:uid(),type:'line'}:{id:uid(),type:'thumb',img:'',text:''});
    save(); renderEntries();
    const rows=$('entries').querySelectorAll('.row'); const last=rows[rows.length-1];
    const ta=last.querySelector('textarea'); if(ta){ta.focus();} last.scrollIntoView({block:'center',behavior:'smooth'});
  }
  $('fTime').onclick=()=>add('time');
  $('fThumb').onclick=()=>addThumbAfter(null);
  $('fLine').onclick=()=>add('line');

  /* ---------- day meta ---------- */

  function go(k){ cur=k; renderAll_(); }
  function shift(n){ const d=parse(cur); d.setDate(d.getDate()+n); go(ymd(d)); }
  $('prev').onclick=()=>shift(-1); $('next').onclick=()=>shift(1);
  $('datePick').addEventListener('change',e=>{ if(e.target.value)go(e.target.value); });

  /* ---------- all videos ---------- */
  function vnum(t){
    const m=String(t||'').toLowerCase().replace(/,/g,'').match(/(\d+(?:\.\d+)?)\s*(k|m|l|lakh|हज़ार|लाख)?/);
    if(!m)return 0; const mul={k:1e3,'हज़ार':1e3,m:1e6,l:1e5,lakh:1e5,'लाख':1e5}[m[2]]||1;
    return parseFloat(m[1])*mul;
  }
  function renderAll(){
    const keys=Object.keys(db.days).filter(k=>{const d=db.days[k];return d.entries&&d.entries.length}).sort().reverse();
    if(!keys.length){ $('all').innerHTML='<div class="empty">अभी कोई वीडियो नहीं लिखा।</div>'; return; }
    let bv=0,bid=null;
    keys.forEach(k=>db.days[k].entries.forEach(e=>{const v=vnum(e.views);if(e.type==='time'&&v>bv){bv=v;bid=e.id}}));
    $('all').innerHTML=keys.map(k=>{
      const d=db.days[k], rows=d.entries.map(e=>{
        if(e.type==='time') return `<div class="sub">${fmt12(e.time)} - ${esc((e.text||'(खाली)').slice(0,110))}${(e.text||'').length>110?'...':''} <b>${e.views?'| '+esc(e.views):''}</b> ${e.id===bid?'<span class="best">सबसे ज़्यादा व्यूज़</span>':''}</div>`;
        if(e.type==='line') return '<div class="sub" style="border-top:3px solid #ff3b1f;margin:4px 0"></div>';
        return `<div class="sub">थंबनेल: ${esc((e.text||'(खाली)').slice(0,110))}</div>`;
      }).join('');
      return `<div class="vid" data-k="${k}"><div><b>${pretty(k)}</b></div><div>${d.entries.filter(e=>e.type==='time').length} वीडियो/एंट्री</div>${rows}</div>`;
    }).join('');
  }
  $('all').addEventListener('click',e=>{ const v=e.target.closest('.vid'); if(v){ go(v.dataset.k); window.scrollTo({top:0,behavior:'smooth'}); } });
  $('toggleAll').onclick=()=>{ $('all').classList.toggle('open'); if($('all').classList.contains('open'))renderAll(); };

  /* ---------- backup ---------- */
  $('export').onclick=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));
    a.download='video-diary-backup-'+ymd(new Date())+'.json'; a.click();
  };
  $('importBtn').onclick=()=>$('importFile').click();
  $('importFile').addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const d=JSON.parse(r.result); if(!d.days)throw 0;
      if(!confirm('अभी का डेटा बदल जाएगा। आगे बढ़ें?'))return;
      db=d; db.goals=db.goals||{}; save(); renderAll_();
    }catch(err){ alert('यह सही बैकअप फ़ाइल नहीं है।'); } };
    r.readAsText(f); e.target.value='';
  });

  function renderAll_(){ renderHead(); renderGoals(); renderTargets(); renderEntries(); if($('all').classList.contains('open'))renderAll(); }
  renderAll_();
})();
</script>
</body>
</html>
